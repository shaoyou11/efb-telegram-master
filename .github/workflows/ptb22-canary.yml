name: PTB 22 canary

on:
  workflow_dispatch:
  push:
    branches:
      - migration/ptb22
  pull_request:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/ptb22-canary.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmagic-dev libwebp-dev
      - name: Install PTB 22 migration dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install '.[tests,tgs]'
          pip install 'git+https://github.com/shaoyou11/ehforwarderbot-core.git@abf737397cdea2dde991b0cb547877157a031cf7'
      - name: Verify PTB generation
        run: |
          python - <<'PY'
          import telegram
          major = int(telegram.__version__.split('.', 1)[0])
          if major != 22:
              raise SystemExit(f'Expected PTB 22.x, got {telegram.__version__}')
          print(telegram.__version__)
          PY
      - name: Run offline regression tests
        env:
          TOKEN: 000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          ADMINS: 1
          GROUPS: 1
          CHANNELS: 1
          USER_SESSION: ci-placeholder
          API_ID: 1
          API_HASH: 0000000000000000000000000000000000
          EFB_TEST_OFFLINE: 1
        run: pytest -q
      - name: Build migration package
        run: python -m build
      - name: Upload migration package
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: efb-telegram-master-ptb22-canary
          path: dist/
          if-no-files-found: error
