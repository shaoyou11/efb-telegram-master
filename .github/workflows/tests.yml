name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
  pull_request:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[tests,tgs]'
        pip install 'git+https://github.com/shaoyou11/ehforwarderbot-core.git@abf737397cdea2dde991b0cb547877157a031cf7'
        pip install 'urllib3==1.26.15'
    - name: Align runtime compatibility patches
      run: |
        python - <<'PY'
        from pathlib import Path
        import apscheduler

        root = Path(apscheduler.__file__).parent
        init_path = root / '__init__.py'
        init_text = init_path.read_text()
        init_text = init_text.replace(
            'from pkg_resources import get_distribution, DistributionNotFound',
            'from importlib.metadata import distribution, PackageNotFoundError',
        )
        init_text = init_text.replace('get_distribution(', 'distribution(')
        init_text = init_text.replace(
            'except DistributionNotFound:', 'except PackageNotFoundError:'
        )
        init_text = init_text.replace(
            'del get_distribution, DistributionNotFound',
            'del distribution, PackageNotFoundError',
        )
        init_path.write_text(init_text)

        base_path = root / 'schedulers' / 'base.py'
        base_text = base_path.read_text()
        base_text = base_text.replace(
            'from pkg_resources import iter_entry_points',
            'from importlib.metadata import entry_points\n\n'
            'def iter_entry_points(group):\n'
            '    return entry_points().select(group=group)',
        )
        base_path.write_text(base_text)
        PY
    # Keep runtime tests blocking while legacy annotations are migrated for current mypy.
    - name: Check type annotations
      continue-on-error: true
      run: |
        mypy --install-types --non-interactive -p efb_telegram_master
    - name: Install binary dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libmagic-dev libwebp-dev
    - name: Check with mypy
      continue-on-error: true
      run: |
        mypy -p efb_telegram_master --ignore-missing-imports
    - name: Test with pytest (unit tests only)
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        ADMINS: ${{ secrets.TELEGRAM_ADMINS }}
        GROUPS: ${{ secrets.TELEGRAM_GROUPS }}
        CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
        USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
        API_ID: ${{ secrets.TELEGRAM_API_ID }}
        API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      run: |
        pytest -vv -r a -l --color=yes
