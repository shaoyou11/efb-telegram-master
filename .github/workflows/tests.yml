name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
  pull_request:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[tests,tgs]'
        pip install 'git+https://github.com/shaoyou11/ehforwarderbot-core.git@abf737397cdea2dde991b0cb547877157a031cf7'
        pip install 'urllib3==1.26.15'
    # Keep runtime tests blocking while legacy annotations are migrated for current mypy.
    - name: Check type annotations
      continue-on-error: true
      run: |
        mypy --install-types --non-interactive -p efb_telegram_master
    - name: Install binary dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libmagic-dev libwebp-dev
    - name: Check with mypy
      continue-on-error: true
      run: |
        mypy -p efb_telegram_master --ignore-missing-imports
    - name: Test with pytest (unit tests only)
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        ADMINS: ${{ secrets.TELEGRAM_ADMINS }}
        GROUPS: ${{ secrets.TELEGRAM_GROUPS }}
        CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
        USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
        API_ID: ${{ secrets.TELEGRAM_API_ID }}
        API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      run: |
        pytest -vv -r a -l --color=yes
