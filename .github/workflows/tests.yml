name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
      - 'pyproject.toml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[tests,tgs]'
        pip install 'git+https://github.com/shaoyou11/ehforwarderbot-core.git@abf737397cdea2dde991b0cb547877157a031cf7'
    # Keep runtime tests blocking while legacy annotations are migrated for current mypy.
    - name: Check type annotations
      continue-on-error: true
      run: |
        mypy --install-types --non-interactive -p efb_telegram_master
    - name: Install binary dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libmagic-dev libwebp-dev
    - name: Check with mypy
      continue-on-error: true
      run: |
        mypy -p efb_telegram_master --ignore-missing-imports
    - name: Test with pytest (unit tests only)
      env:
        # Unit tests need valid-shaped configuration to build local objects;
        # integration tests remain skipped unless explicitly run with secrets.
        TOKEN: 000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        ADMINS: 1
        GROUPS: 1
        CHANNELS: 1
        USER_SESSION: ci-placeholder
        API_ID: 1
        API_HASH: 0000000000000000000000000000000000
        EFB_TEST_OFFLINE: 1
      run: |
        pytest -vv -r a -l --color=yes
